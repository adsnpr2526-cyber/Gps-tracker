<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Precision GPS Tracker</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f6f9;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: var(--bg-color); 
            color: #333; 
            margin: 0;
        }
        .card { 
            background: white; 
            padding: 24px; 
            border-radius: 20px; 
            max-width: 420px; 
            margin: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        .distance-title { font-size: 0.95rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        #distance { font-size: 3rem; color: var(--primary-color); font-weight: 800; margin: 5px 0 15px 0; line-height: 1; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-item { background: #f8f9fa; padding: 10px; border-radius: 12px; border: 1px solid #eee; }
        .stat-label { font-size: 0.75rem; color: #777; font-weight: 600; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: #222; margin-top: 2px; }
        
        .signal-box { margin: 15px 0; padding: 12px; background: #f8f9fa; border-radius: 12px; font-size: 0.85rem; border: 1px solid #eee; }
        .bar-container { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 25px; margin: 8px 0; }
        .bar { width: 8px; background: #ddd; border-radius: 3px; transition: all 0.3s ease; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        button { flex: 1; padding: 14px; font-size: 1rem; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; transition: all 0.2s; }
        .btn-start { background: var(--success-color); }
        .btn-start:disabled { background: #a5d6a7; cursor: not-allowed; }
        .btn-stop { background: var(--danger-color); }
        .btn-stop:disabled { background: #ef9a9a; cursor: not-allowed; }
        .btn-reset { background: #6c757d; flex: 0.4; }
        
        #status { font-size: 0.85rem; color: #666; margin-top: 10px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <div class="distance-title">ระยะทางรวม</div>
        <div id="distance">0 <span style="font-size:1.5rem">เมตร</span></div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">ความเร็วปัจจุบัน</div>
                <div class="stat-value"><span id="speed-val">0.0</span> <span style="font-size:0.8rem">กม./ชม.</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-label">ระยะเวลารวม</div>
                <div class="stat-value" id="time-val">00:00:00</div>
            </div>
        </div>

        <!-- ส่วนแสดงความแรงสัญญาณ GPS -->
        <div class="signal-box">
            <div>สัญญาณ GPS: <span id="signal-text" style="font-weight: bold;">กำลังตรวจสอบ...</span></div>
            <div class="bar-container">
                <div class="bar" id="b1" style="height: 30%;"></div>
                <div class="bar" id="b2" style="height: 50%;"></div>
                <div class="bar" id="b3" style="height: 75%;"></div>
                <div class="bar" id="b4" style="height: 100%;"></div>
            </div>
            <div>ความแม่นยำ: ±<span id="accuracy-val">-</span> เมตร</div>
            <div style="margin-top: 4px; color: #888; font-size: 0.75rem;">
                <span id="latitude-val">0.000000</span>, <span id="longitude-val">0.000000</span>
            </div>
        </div>

        <div class="btn-group">
            <button id="btn-start" class="btn-start" onclick="startTracking()">เริ่ม</button>
            <button id="btn-stop" class="btn-stop" onclick="stopTracking()" disabled>หยุด</button>
            <button id="btn-reset" class="btn-reset" onclick="resetTracking()">รีเซ็ต</button>
        </div>
        
        <p id="status">สถานะ: พร้อมใช้งาน</p>
    </div>

    <script>
        let watchID = null;
        let totalDistance = 0;
        let lastCoord = null;
        let wakeLock = null;
        let timerInterval = null;
        let secondsElapsed = 0;

        // --- Kalman Filter Class สำหรับลด GPS Drift และสร้าง smoothing ---
        class KalmanFilter {
            constructor(R = 0.0001, Q = 0.00001) {
                this.R = R; // Measurement Noise
                this.Q = Q; // Process Noise
                this.x = null; // State estimation
                this.p = 1; // Estimation error covariance
            }

            filter(measurement) {
                if (this.x === null) {
                    this.x = measurement;
                    return measurement;
                }
                this.p = this.p + this.Q;
                const k = this.p / (this.p + this.R);
                this.x = this.x + k * (measurement - this.x);
                this.p = (1 - k) * this.p;
                return this.x;
            }

            reset() {
                this.x = null;
                this.p = 1;
            }
        }

        const kalmanLat = new KalmanFilter();
        const kalmanLng = new KalmanFilter();

        // คำนวณระยะทางทางภูมิศาสตร์ (Haversine Formula Exact)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // รัศมีโลกเฉลี่ย (เมตร)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // อัปเดต UI ความแรงสัญญาณ
        function updateSignalStrength(accuracy) {
            const accuracyValEl = document.getElementById("accuracy-val");
            const signalTextEl = document.getElementById("signal-text");
            
            accuracyValEl.innerText = Math.round(accuracy);
            
            let bars = 0;
            let text = "แย่มาก (อับสัญญาณ)";
            let color = "#dc3545";

            if (accuracy <= 6) {
                bars = 4; text = "ดีเยี่ยม"; color = "#28a745";
            } else if (accuracy <= 12) {
                bars = 3; text = "ดี"; color = "#17a2b8";
            } else if (accuracy <= 22) {
                bars = 2; text = "ปานกลาง"; color = "#ffc107";
            } else {
                bars = 1; text = "อ่อน"; color = "#dc3545";
            }

            signalTextEl.innerText = text;
            signalTextEl.style.color = color;

            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById("b" + i);
                if (i <= bars) {
                    bar.style.background = color;
                } else {
                    bar.style.background = "#ddd";
                }
            }
        }

        // จัดการเมื่อได้พิกัด GPS
        function handlePosition(position) {
            const accuracy = position.coords.accuracy;
            const timestamp = position.timestamp;
            const rawSpeed = position.coords.speed; // m/s

            updateSignalStrength(accuracy);

            // ใช้ Kalman Filter กับ Lat/Lng เพื่อความราบรื่นเวลากลางถนนและเข้าโค้ง
            const filteredLat = kalmanLat.filter(position.coords.latitude);
            const filteredLon = kalmanLng.filter(position.coords.longitude);

            document.getElementById("latitude-val").innerText = filteredLat.toFixed(6);
            document.getElementById("longitude-val").innerText = filteredLon.toFixed(6);

            // คำนวณความเร็ว
            let currentSpeedKmh = 0;
            if (rawSpeed !== null && rawSpeed >= 0) {
                currentSpeedKmh = rawSpeed * 3.6;
            }
            document.getElementById("speed-val").innerText = currentSpeedKmh.toFixed(1);

            if (watchID === null) return;

            document.getElementById("status").innerText = "สถานะ: กำลังบันทึกระยะทาง...";

            // 1. กรองสัญญาณที่แย่เกินไป (เช่น แม่นยำแย่กว่า 25 เมตร)
            if (accuracy > 25) return;

            const currentCoord = {
                lat: filteredLat,
                lon: filteredLon,
                time: timestamp
            };

            if (lastCoord) {
                const distance = calculateDistance(lastCoord.lat, lastCoord.lon, currentCoord.lat, currentCoord.lon);
                const timeDiff = (currentCoord.time - lastCoord.time) / 1000; // วินาที

                if (timeDiff <= 0) return;

                const calculatedSpeedKmh = (distance / timeDiff) * 3.6;

                // --- อัลกอริทึมป้องกัน GPS Drift & บันทึกโค้งอย่างแม่นยำ ---
                // 1. Minimum Speed Threshold: หากความเร็วน้อยกว่า 0.8 กม./ชม. ถือว่าหยุดนิ่ง (ไม่ขยับระยะทาง)
                // 2. Dynamic Distance Threshold: ปรับระยะขยับขั้นต่ำตามค่า Accuracy (ป้องกันสวิงยามจอดนิ่ง)
                // 3. Max Speed Filter: ป้องกันพิกัดวาร์ป (เกิน 180 กม./ชม.)
                
                const isMoving = currentSpeedKmh > 0.8 || calculatedSpeedKmh > 0.8;
                const minMovementThreshold = Math.max(1.5, accuracy * 0.15); // ยอมรับการขยับสั้นๆ เพื่อเก็บโค้งถนน

                if (isMoving && distance >= minMovementThreshold && calculatedSpeedKmh <= 180) {
                    totalDistance += distance;
                    
                    // แสดงผลระยะทาง
                    if (totalDistance >= 1000) {
                        document.getElementById("distance").innerHTML = (totalDistance / 1000).toFixed(2) + ' <span style="font-size:1.5rem">กิโลเมตร</span>';
                    } else {
                        document.getElementById("distance").innerHTML = Math.round(totalDistance) + ' <span style="font-size:1.5rem">เมตร</span>';
                    }

                    // อัปเดตตำแหน่งล่าสุดเฉพาะเมื่อขยับจริง
                    lastCoord = currentCoord;
                } else if (!isMoving) {
                    // หากหยุดนิ่ง รีเซ็ตเวลาอ้างอิง เพื่อไม่ให้เกิดระยะทางสะสมย้อนหลังเมื่อเริ่มเดินต่อ
                    lastCoord.time = currentCoord.time;
                }
            } else {
                lastCoord = currentCoord;
            }
        }

        function handleError(error) {
            let errorMsg = "เกิดข้อผิดพลาดในการดึง GPS";
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    errorMsg = "ถูกปฏิเสธสิทธิ์ GPS — กรุณาเปิด Location ให้เบราว์เซอร์";
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMsg = "ไม่พบตำแหน่ง — กรุณาเปิด GPS หรือออกไปที่โล่ง";
                    break;
                case error.TIMEOUT:
                    errorMsg = "หมดเวลาจับสัญญาณ GPS — กำลังพยายามใหม่...";
                    break;
            }
            document.getElementById("status").innerText = "สถานะ: " + errorMsg;
        }

        // Keep Screen Awake (ป้องกันจอดับ)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("Wake Lock Error:", err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => wakeLock = null);
            }
        }

        // ตัวนับเวลา
        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
                const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById("time-val").innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function startTracking() {
            if (!("geolocation" in navigator)) {
                alert("อุปกรณ์นี้ไม่รองรับการใช้งาน GPS");
                return;
            }

            kalmanLat.reset();
            kalmanLng.reset();
            
            lastCoord = null;
            document.getElementById("btn-start").disabled = true;
            document.getElementById("btn-stop").disabled = false;

            requestWakeLock();
            startTimer();

            // ตั้งค่า High Accuracy สำหรับถนนและการเข้าโค้ง
            const options = {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            };

            watchID = navigator.geolocation.watchPosition(handlePosition, handleError, options);
        }

        function stopTracking() {
            if (watchID !== null) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
            }

            releaseWakeLock();
            stopTimer();

            document.getElementById("btn-start").disabled = false;
            document.getElementById("btn-stop").disabled = true;
            document.getElementById("status").innerText = "สถานะ: หยุดบันทึกแล้ว";
        }

        function resetTracking() {
            stopTracking();
            totalDistance = 0;
            secondsElapsed = 0;
            lastCoord = null;
            kalmanLat.reset();
            kalmanLng.reset();

            document.getElementById("distance").innerHTML = '0 <span style="font-size:1.5rem">เมตร</span>';
            document.getElementById("speed-val").innerText = "0.0";
            document.getElementById("time-val").innerText = "00:00:00";
            document.getElementById("status").innerText = "สถานะ: รีเซ็ตข้อมูลเรียบร้อย";
        }

        // จัดการเมื่อผู้ใช้สลับหน้าจอหรือเปิดจอกลับมา
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && watchID !== null) {
                requestWakeLock();
            }
        });

        // ตรวจสอบ GPS ทันทีเมื่อโหลดหน้าเว็บ
        window.addEventListener("load", () => {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        updateSignalStrength(pos.coords.accuracy);
                        document.getElementById("latitude-val").innerText = pos.coords.latitude.toFixed(6);
                        document.getElementById("longitude-val").innerText = pos.coords.longitude.toFixed(6);
                        document.getElementById("status").innerText = "สถานะ: GPS พร้อมใช้งาน";
                    },
                    handleError,
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        });
    </script>
</body>
</html>
